name: tests

on:
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # The data checks compare web/data with the last committed
          # release, and the default shallow clone carries no history to
          # find it in - the comparison would skip rather than fail, and
          # the whole regression module would go quietly unrun
          fetch-depth: 0

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        # The freshness checks measure the export against today's date,
        # which is a question for a data refresh rather than for a pull
        # request - without this they turn red 45 days after the last one
        run: python -m pytest -v -m 'not freshness'